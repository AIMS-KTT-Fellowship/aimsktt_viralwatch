name: 30 Second Continuous Loop

on:
  # Allows you to start the loop manually from the GitHub UI Actions tab
  workflow_dispatch:

jobs:
  continuous-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run loop every 30 seconds
        run: |
          echo "Starting continuous loop..."
          while true; do
            echo "Task executed at: $(date)"
            
            # --- PUT YOUR COMMANDS HERE ---
            # Example: python script.py or curl https://example.com
            # ------------------------------

            echo "Sleeping for 30 seconds..."
            sleep 30
          done
