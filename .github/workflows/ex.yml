# The name of the automation workflow
name: Simple Demo Workflow

# The event that triggers the automation
on: [push]

# The execution block containing one or more jobs
jobs:
  say-hello:
    # The type of virtual machine the runner will use
    runs-on: ubuntu-latest

    # The sequence of tasks to execute
    steps:
      # Step 1: Downloads a copy of your repository code onto the runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Executes a terminal command
      - name: Print a message
        run: echo "Hello, world! Your GitHub Action is working successfully."

